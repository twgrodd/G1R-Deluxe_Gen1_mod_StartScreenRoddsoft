name: Release

# Production releases are driven by an intentional manifest version bump.
on:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to release (must match manifest.json)."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine and validate version
        id: ver
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess, sys
          SEMVER = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")
          with open("manifest.json", encoding="utf-8") as fh:
              version = str(json.load(fh).get("version", "")).strip()
          if not SEMVER.match(version):
              print(f"::error::manifest version {version!r} is not X.Y.Z", file=sys.stderr)
              raise SystemExit(1)
          override = os.environ.get("DISPATCH_VERSION", "").strip()
          if override and override != version:
              print(f"::error::dispatch version {override!r} must match manifest version {version!r}", file=sys.stderr)
              raise SystemExit(1)
          tag = "v" + version
          existing = subprocess.run(["git", "rev-parse", "-q", "--verify", "refs/tags/" + tag],
                                    capture_output=True).returncode == 0
          if existing:
              print(f"::error::Tag {tag} already exists; bump manifest.json before releasing.", file=sys.stderr)
              raise SystemExit(1)
          print(f"version={version}")
          print(f"tag={tag}")
          PY

      - name: Build the mod .zip
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          MOD_SLUG: "RoddSoft-Edition-Title-Screen"
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/pkg"
          out="$GITHUB_WORKSPACE/dist"
          rm -rf "$staging" "$out"
          mkdir -p "$staging" "$out"
          git archive HEAD | tar -x -C "$staging"
          rm -rf "$staging/.github" "$staging/tools" "$staging/.gitattributes" "$staging/.gitignore" "$staging/.luarc.json"
          zip_path="$out/${MOD_SLUG}-${VERSION}.zip"
          (cd "$staging" && zip -qr "$zip_path" .)
          unzip -l "$zip_path"
          (cd "$out" && sha256sum "${MOD_SLUG}-${VERSION}.zip" > sha256sums.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          MOD_SLUG: "RoddSoft-Edition-Title-Screen"
        run: |
          set -euo pipefail
          prev="$(git tag -l 'v*' --sort=-v:refname | head -1 || true)"
          range="${prev:+${prev}..}$GITHUB_SHA"
          changes="$(git log --no-merges --pretty='- %s' "$range" | head -50 || true)"
          notes=$'Download the .zip and install it from the game: MODS > Import mod .zip.'
          if [ -n "$changes" ]; then
            notes+=$'\n\n## Changes\n\n'"$changes"
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$VERSION" --notes "$notes" \
            "dist/${MOD_SLUG}-${VERSION}.zip" "dist/sha256sums.txt"
